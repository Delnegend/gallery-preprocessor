name: Release / Build Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release mode / build target"
        required: true
        type: choice
        default: "new-tag"
        options:
          - new-tag  # Gate on CI -> tag & push -> build & publish release
          - tag      # Rebuild existing tag -> build & publish release
          - commit   # Test build latest commit -> upload Actions artifacts only (no release)
      ref:
        description: "Custom tag or commit SHA (optional, defaults to latest)"
        required: false
        type: string
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC (defaults to target: new-tag)

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  BINARY_NAME: gallery-preprocessor

jobs:
  prepare:
    name: Prepare / Bump Version
    runs-on: ubuntu-latest   # full runner: it runs `just check`
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist_credentials: true
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install frontend dependencies
        run: cd frontend && bun install

      - name: Build frontend for embed
        run: cd frontend && bun run build

      # -----------------------------------------------------------------------
      # Mode 1: new-tag (calculate semver -> CI gate -> tag & push)
      # -----------------------------------------------------------------------
      - name: Calculate Next SemVer
        if: (inputs.target || 'new-tag') == 'new-tag'
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: CI Gate (verify code is green before tagging)
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        run: just check

      - name: Bump package manager version
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        env:
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: just bump "$NEXT_STRICT"

      - name: Commit the bump (skipped when the project has no manifest)
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        env:
          NEXT_TAG: ${{ steps.semver.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"

          git add -u
          if git diff --staged --quiet; then
            echo "no manifest to bump — tagging HEAD"
          else
            git commit -m "chore(release): ${NEXT_TAG}"
          fi

          git rev-parse -q --verify "refs/tags/${NEXT_TAG}" >/dev/null && { echo "::error::tag ${NEXT_TAG} already exists"; exit 1; }
          git tag -a "${NEXT_TAG}" -m "Release ${NEXT_TAG}"

          git push origin HEAD:main "refs/tags/${NEXT_TAG}"

      # -----------------------------------------------------------------------
      # Resolve outputs for the build job
      # -----------------------------------------------------------------------
      - name: Resolve outputs
        id: resolve
        env:
          TARGET: ${{ inputs.target || 'new-tag' }}
          INPUT_REF: ${{ inputs.ref }}
          BUMP: ${{ steps.semver.outputs.bump }}
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "new-tag" ]; then
            if [ "$BUMP" = "none" ]; then
              echo "No version bump needed (current: ${CURRENT:-none})."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "ref=$NEXT"
              echo "version=$NEXT_STRICT"
              echo "publish=true"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "tag" ]; then
            TAG="${INPUT_REF:-$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)}"
            [ -n "$TAG" ] || { echo "::error::No release tag found"; exit 1; }
            { echo "ref=$TAG"; echo "version=${TAG#v}"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
          else
            SHA="${INPUT_REF:-$(git rev-parse HEAD)}"
            { echo "ref=$SHA"; echo "version=$SHA"; echo "publish=false"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            echo "Running test build against commit $SHA (will not publish release)"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux/amd64
          - os: macos-latest
            goos: darwin
            goarch: universal
            platform: darwin/universal
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install NSIS (Windows)
        if: matrix.goos == 'windows'
        run: choco install nsis -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App (Linux)
        if: matrix.goos == 'linux'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          go_bin="$(go env GOPATH)/bin"
          export PATH="$PATH:$go_bin"
          wails build -platform "$PLATFORM" -clean -tags webkit2_41

      - name: Build Wails App (macOS)
        if: matrix.goos == 'darwin'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          go_bin="$(go env GOPATH)/bin"
          export PATH="$PATH:$go_bin"
          wails build -platform "$PLATFORM" -clean

      - name: Build Wails App (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          go_bin="$(go env GOPATH)/bin"
          export PATH="$PATH:$go_bin"
          wails build -platform "$PLATFORM" -nsis -clean

      - name: Compress binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          base="${BINARY_NAME}-${GOOS}-${GOARCH}"
          mkdir -p "$base"
          if [ "$GOOS" = "windows" ]; then
            cp "build/bin/${BINARY_NAME}.exe" "$base/"
            cp build/bin/*-installer.exe "$base/" 2>/dev/null || true
            7z a -t7z "${base}.7z" "$base"
          elif [ "$GOOS" = "darwin" ]; then
            cp -R "build/bin/${BINARY_NAME}.app" "$base/"
            tar -cJf "${base}.tar.xz" "$base"
          else
            cp "build/bin/${BINARY_NAME}" "$base/"
            tar -cJf "${base}.tar.xz" "$base"
          fi
          rm -rf "$base"
          ls -lh "${base}."*

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Generate release notes from commits since the last tag
        id: notes
        env:
          RELEASE_REF: ${{ needs.prepare.outputs.ref }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT="$RELEASE_REF"
          # The tag we are releasing already points at HEAD, so describe from
          # its parent: that is the previous release, not this one.
          if git rev-parse -q --verify "refs/tags/${CURRENT}" >/dev/null; then
            PREV="$(git describe --tags --abbrev=0 "${CURRENT}^" 2>/dev/null || true)"
          else
            PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${CURRENT}"
            COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...v${VERSION}"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..${CURRENT}"
            COMPARE=""
          fi
          echo "Generating notes for range $RANGE"
          TMP="$(mktemp -d)"
          git log --pretty=format:"%s" "$RANGE" > "$TMP/all"
          {
            echo "## What's Changed"
            echo
            for spec in "feat **Features**" "fix **Bug Fixes**" "docs **Documentation**" "ci **CI & Workflows**" "test **Tests**" "refactor **Refactoring**" "perf **Performance**" "chore **Chores**"; do
              type="${spec%% *}"
              grep -E "^${type}(\([^)]*\))?: " "$TMP/all" > "$TMP/items" || continue
              echo "${spec#* }"
              sed -E "s/^${type}(\([^)]*\))?: +/  - /" "$TMP/items"
              echo
            done
            grep -Ev "^[a-z]+(\([^)]*\))?: " "$TMP/all" > "$TMP/other" || true
            if [ -s "$TMP/other" ]; then
              echo "**Other**"
              sed 's/^/  - /' "$TMP/other"
              echo
            fi
            echo "**Downloads**"
            echo "- **Windows**: \`.7z\` archive (includes standalone executable and installer)"
            echo "- **Linux / macOS**: \`.tar.xz\` archive (extract with \`tar -xJf\`)"
            if [ -n "$COMPARE" ]; then
              echo
              echo "**Full Changelog**: $COMPARE"
            fi
          } > notes.md
          echo "=== draft release notes ==="
          cat notes.md
          echo "notes=$PWD/notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish Consolidated Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          body_path: ${{ steps.notes.outputs.notes }}
          files: artifacts/**/*
