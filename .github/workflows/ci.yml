name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Queued CI runs are redundant: the newer run checks a superset of the older's
# commits, so cancel the stale one instead of burning two runners on
# back-to-back pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One gate, one contract: `just check`. No build matrix — building the
# cross-platform Wails artifacts is release.yml's job, not a PR's.
jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install frontend dependencies
        run: cd frontend && bun install
      - name: Build frontend for embed
        run: cd frontend && bun run build
      - name: Run checks
        run: just check
