name: Weekly Update

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BUN_MIN_RELEASE_AGE: 259200 # 3 days in seconds

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Update dependencies
        run: |
          # Go dependencies
          go get -u ./...
          go mod tidy

          # Frontend dependencies with minimum release age
          cd frontend
          bun update --latest --minimum-release-age ${{ env.BUN_MIN_RELEASE_AGE }}

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Build frontend
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd frontend
          bun install
          bun run build

      - name: Validate Go build
        if: steps.changes.outputs.changed == 'true'
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
          go build -tags webkit2_41 ./...

      - name: Draft PR body from the dependency diff
        id: prbody
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            echo "## Dependency changes"
            echo ""
            echo "### Go dependencies"
            git diff -- go.mod | awk '
              /^[+-][[:space:]]+[^ ]+ v[0-9]/ {
                sign = substr($0, 1, 1); mod = $2; ver = $3
                if (sign == "-") old[mod] = ver; else new[mod] = ver
              }
              END {
                for (m in old) printf "- %s: %s -> %s\n", m, old[m], (new[m] ? new[m] : "removed")
                for (m in new) if (!(m in old)) printf "- %s: added %s\n", m, new[m]
              }' | sort
            echo ""
            echo "### Frontend dependencies"
            git diff -- frontend/package.json | awk -F'[:", ]+' '
              /^[+-][[:space:]]+"[^"]+": "[^"]+"/ {
                sign = substr($1, 1, 1); pkg = $2; ver = $3
                if (sign == "-") old[pkg] = ver; else new[pkg] = ver
              }
              END {
                for (p in old) printf "- %s: %s -> %s\n", p, old[p], (new[p] ? new[p] : "removed")
                for (p in new) if (!(m in old)) printf "- %s: added %s\n", p, new[p]
              }' | sort
            echo ""
            echo "Generated by the weekly dependency-update workflow. Frontend and backend builds were validated against these changes."
          } > /tmp/pr-body.md
          {
            echo "body<<EOF"
            cat /tmp/pr-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open PR for review
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): weekly dependency update'
          title: 'chore(deps): weekly dependency update'
          body: ${{ steps.prbody.outputs.body }}
          branch: chore/update-deps
          delete-branch: true
          labels: dependencies
